services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: careerflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - careerflow-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. Express Backend API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./careerflow-api
      dockerfile: Dockerfile
    container_name: careerflow-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      MONGODB_URI: "mongodb://mongo:27017/careerflow"
      DATABASE_NAME: "careerflow"
      ACCESS_TOKEN_SECRET: "careerflow-production-access-token-secret-minimum-32-chars-long"
      ACCESS_TOKEN_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "careerflow-production-refresh-token-secret-minimum-32-chars-long"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      CLIENT_URL: "http://localhost,http://localhost:80,http://localhost:5173"
      AI_MOCK: "true"
      STORAGE_MOCK: "true"
      STORAGE_MOCK_DIR: "/app/.storage"
      RESUME_MAX_SIZE_MB: "10"
    volumes:
      - backend-storage:/app/.storage
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - careerflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 3. Nginx Frontend SPA Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./careerflow-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5000/api"
    container_name: careerflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careerflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# ---------------------------------------------------------------------------
# Named Volumes & Networks
# ---------------------------------------------------------------------------
volumes:
  mongo-data:
    driver: local
  backend-storage:
    driver: local

networks:
  careerflow-network:
    driver: bridge