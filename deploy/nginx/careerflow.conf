# ==============================================================================
# CAREERFLOW HOST NGINX REVERSE PROXY CONFIGURATION
# File: /etc/nginx/sites-available/careerflow.conf
#
# SUBDOMAINS:
#   - app.yourdomain.com -> careerflow-frontend (http://127.0.0.1:3000)
#   - api.yourdomain.com -> careerflow-api      (http://127.0.0.1:5000)
#
# ACTIVATION ON VPS:
#   sudo ln -sf /etc/nginx/sites-available/careerflow.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# Rate Limiting Zones (DDoS and Brute Force Mitigation at Host Edge)
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Plaintext Blocks (Port 80) -> ACME Challenge & 301 HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com api.yourdomain.com;

    # Let's Encrypt ACME HTTP-01 Validation
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Frontend Web Application (app.yourdomain.com) -> Loopback 127.0.0.1:3000
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Host Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to Frontend Container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Connection Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer Optimization
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    # Logging
    access_log /var/log/nginx/careerflow_frontend_access.log;
    error_log /var/log/nginx/careerflow_frontend_error.log warn;
}

# ------------------------------------------------------------------------------
# 3. Backend API Service (api.yourdomain.com) -> Loopback 127.0.0.1:5000
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Security Headers for API
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # File Upload Limits (Resume PDF/DOCX support up to 10MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Extended Timeouts for AI Job Matching & Direction Generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy to Backend API Container
    location / {
        # Edge Rate Limiting
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Crucial for Express Helmet, CORS & RateLimiter Middleware
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Strict Rate Limiting on Authentication Endpoints
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Logging
    access_log /var/log/nginx/careerflow_api_access.log;
    error_log /var/log/nginx/careerflow_api_error.log warn;
}
