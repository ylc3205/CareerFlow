name: CD Production Deployment

on:
  workflow_run:
    workflows: ["CI Quality Gates & Docker Build Verification"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force redeployment without CI gate check"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-to-vps:
    name: Deploy to Production VPS
    # Only run if CI completed with 'success' OR if triggered manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Execute Deployment & Health Verification on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST << 'EOF'
            set -euo pipefail

            DEPLOY_DIR="/home/deployer/careerflow"
            echo "==> [1/6] Navigating to deployment directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "==> [2/6] Storing previous Git commit hash for rollback safety"
            PREV_COMMIT=$(git rev-parse HEAD)

            echo "==> [3/6] Fetching and fast-forwarding latest code from main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "==> [4/6] Building and restarting containers"
            docker compose -f docker-compose.prod.yml --env-file .env.production build
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

            echo "==> [5/6] Performing automated health check validation loop"
            HEALTH_URL="http://127.0.0.1:5000/api/health/ready"
            MAX_ATTEMPTS=12
            DELAY=5
            ATTEMPT=1
            IS_HEALTHY=false

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Checking backend readiness ($ATTEMPT/$MAX_ATTEMPTS)..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "SUCCESS: Backend responded with HTTP 200 Ready!"
                IS_HEALTHY=true
                break
              fi

              echo "Backend returned HTTP $HTTP_STATUS. Retrying in ${DELAY}s..."
              sleep $DELAY
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$IS_HEALTHY" = false ]; then
              echo "FATAL: Health check failed after $MAX_ATTEMPTS attempts! Initiating Rollback..."
              git checkout "$PREV_COMMIT"
              docker compose -f docker-compose.prod.yml --env-file .env.production build
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
              echo "ROLLBACK COMPLETED to commit $PREV_COMMIT."
              exit 1
            fi

            echo "==> [6/6] Pruning dangling Docker images to preserve disk space"
            docker image prune -f

            echo "DEPLOYMENT SUCCESSFUL! CareerFlow is healthy and active."
          EOF
