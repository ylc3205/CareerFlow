name: CI Quality Gates & Docker Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Backend CI: 164 Tests with MongoDB Service Container
  # ===========================================================================
  backend-ci:
    name: Backend Tests (164 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: careerflow-api

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/careerflow-test
      ACCESS_TOKEN_SECRET: ci-test-access-token-secret-minimum-32-chars-long
      REFRESH_TOKEN_SECRET: ci-test-refresh-token-secret-minimum-32-chars-long
      CLIENT_URL: http://localhost:5173
      AI_MOCK: "true"
      STORAGE_MOCK: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: careerflow-api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Vitest Suite
        run: npm test

  # ===========================================================================
  # 2. Frontend CI: Lint, 268 Tests & Production Build Verification
  # ===========================================================================
  frontend-ci:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: careerflow-frontend

    env:
      VITE_API_URL: http://localhost:5000/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: careerflow-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Fast Linter (Oxlint)
        run: npm run lint

      - name: Run Frontend Vitest Suite (268 Tests)
        run: npm test

      - name: Verify Production Bundle Build
        run: npm run build

  # ===========================================================================
  # 3. Docker Verification: Multi-Stage Build & Layer Cache Validation
  # ===========================================================================
  docker-verification:
    name: Docker Image Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./careerflow-api
          file: ./careerflow-api/Dockerfile
          push: false
          tags: careerflow-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./careerflow-frontend
          file: ./careerflow-frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:5000/api
          push: false
          tags: careerflow-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
